[project]
name = "marketdata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "yfinance>=1.5.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.3.260530",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # bugbear (likely bugs)
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "typings"

[tool.pyright]
typeCheckingMode = "strict"
stubPath = "typings"
venvPath = "."
venv = ".venv"
